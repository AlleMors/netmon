name: CI

on:
  push:
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Sintassi Python
        run: python -m py_compile netmon-web.py netmon-report.py tools/gen_sample.py

      - name: Sintassi Bash
        run: bash -n netmon.sh install.sh

      - name: ShellCheck
        run: shellcheck netmon.sh install.sh

      - name: Dipendenze di test
        run: pip install -r requirements-dev.txt

      - name: Test
        run: python -m pytest tests -q

      - name: Verifica sample.csv
        run: |
          python netmon-report.py sample.csv --hours 168 > /dev/null
          python netmon-report.py sample.csv --hours 168 --svg /tmp/sample.svg
          test -s /tmp/sample.svg
